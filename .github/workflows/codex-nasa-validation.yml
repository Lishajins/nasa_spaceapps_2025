name: Temporary NASA dependency validation
on:
  push:
    branches:
      - codex/trivy-nasa-final-fixes
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Resolve bloomwatch dependencies
        run: npm install --package-lock-only --ignore-scripts --prefix bloomwatch
      - name: Apply non-forced bloomwatch audit fixes
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts --prefix bloomwatch
      - name: Resolve backend requirements without installing
        run: python -m pip install --dry-run --ignore-installed --report /tmp/pip-report.json -r backend/requirements.txt
      - name: Summarize patched dependency versions
        run: |
          python - <<'PY'
          import json
          versions = {x['metadata']['name'].lower(): x['metadata']['version'] for x in json.load(open('/tmp/pip-report.json'))['install']}
          print(f"pyasn1={versions.get('pyasn1')}")
          PY
          node -p "'react-router-dom=' + require('./bloomwatch/package-lock.json').packages['node_modules/react-router-dom'].version + '; react-router=' + require('./bloomwatch/package-lock.json').packages['node_modules/react-router'].version"
      - name: Commit bloomwatch lockfile only
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          printf 'Changed files:\n%s\n' "$changed"
          if [ "$changed" != "bloomwatch/package-lock.json" ]; then
            echo 'Unexpected changed files or no lockfile update.'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloomwatch/package-lock.json
          git commit -m "fix(deps): update bloomwatch security lockfile"
          git push origin HEAD:refs/heads/codex/trivy-nasa-final-fixes