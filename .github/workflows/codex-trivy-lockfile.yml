name: Temporary Trivy lockfile remediation
on:
  push:
    branches:
      - codex/trivy-safe-lock-updates
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Update bloomwatch lockfile without forcing breaking changes
        id: audit
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts --prefix bloomwatch
      - name: Commit lockfile only
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          printf 'Changed files:\n%s\n' "$changed"
          if [ "$changed" != "bloomwatch/package-lock.json" ]; then
            echo 'No targeted lockfile update was applied.'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloomwatch/package-lock.json
          git commit -m "fix(deps): update vulnerable bloomwatch lockfile"
          git push origin HEAD:refs/heads/codex/trivy-safe-lock-updates