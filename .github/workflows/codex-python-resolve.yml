name: Temporary Python dependency resolution check
on:
  push:
    branches:
      - codex/trivy-python-remediation
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve pinned backend requirements without installing
        run: python -m pip install --dry-run --ignore-installed --report /tmp/pip-report.json -r backend/requirements.txt
      - name: Summarize resolved security package versions
        run: |
          python - <<'PY'
          import json
          data = json.load(open('/tmp/pip-report.json'))
          versions = {x['metadata']['name'].lower(): x['metadata']['version'] for x in data['install']}
          for package in ('fastapi', 'starlette', 'anyio', 'httplib2', 'idna', 'protobuf', 'pyasn1', 'requests', 'urllib3'):
              print(f'{package}={versions.get(package, "missing")}')
          PY